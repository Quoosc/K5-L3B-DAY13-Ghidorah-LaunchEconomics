# Lab 13 · Kế hoạch pilot LogiX-VN · Đề xuất chờ Gate 2a
# D1 · baseline 0,70, alpha 0,05, power 0,80, ICC 0,02.
# a) Theo yêu cầu, MDE 5 điểm: 1.251 yêu cầu mỗi nhánh.
# b) Theo nhân viên, m = 75: DE 2,48, 3.103 yêu cầu và 42 người mỗi nhánh.
# c) Với 20 nhân viên mỗi nhánh, giới hạn hiệu dụng là 1.000, dưới 1.251.
# d) Với 6 depot mỗi nhánh, giới hạn hiệu dụng là 300.
# e) Với MDE 6 điểm, 20 người mỗi nhánh cần 299 yêu cầu mỗi người.
#    20m / (1 + (m − 1) × 0,02) ≥ 859, tức m ≥ 841,82 / 2,82.
#    Với m = 299: 5.980 yêu cầu thô / DE 6,96 = 859,20 hiệu dụng mỗi nhánh.
#
# D2 · Đối chứng đồng thời, phân tầng theo depot, ngẫu nhiên theo staff_id.
# Rủi ro chia sẻ gợi ý trong cùng depot: phân quyền và kiểm tra log truy cập.
# Chốt chỉ số, ngưỡng và mốc quyết định trước ngày bắt đầu. Mỗi nhánh có 20 cụm.
# Đánh đổi: đủ lực cho mức chênh 6 điểm theo giả định. Nếu hiệu ứng thật 5 điểm,
# power xấp xỉ 64,18% theo NormalIndPower với 859,20 yêu cầu hiệu dụng mỗi nhánh.
# Tỷ lệ mở lại quan sát trong đợt chạy thử: 51/1.200 = 4,25%.
# Phạm vi dự kiến: 39/982 = 3,97%. Đây là tỷ lệ lịch sử từ cờ CSV. Xác nhận quy
# ước cửa sổ đo cũ trước khi dùng làm mốc cho ngưỡng 6%. Ngưỡng chênh 2 điểm dùng
# hai nhánh đo cùng quy ước.
pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Dự kiến noi_dia và hang_nang tại các depot đủ điều kiện trong mạng 12 depot. Xác nhận theo A3 và danh sách đủ 40 nhân viên trước khi bật pilot. Mẫu chạy thử ở 6 depot chỉ có 20 staff_id khác nhau."
  assignment:
    unit: staff
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]  # 4, 10, 20 nhân viên. Hai bước đầu chỉ đánh giá vận hành.
  rollout_gate: "Hai bậc 10% và 25% có 7 ngày thu yêu cầu để rà an toàn. Sau đó tạm chuyển yêu cầu mới về luồng nhân viên, chờ đủ 7 ngày theo dõi cho ca cuối của nhóm yêu cầu đã thu ở cả hai nhánh rồi rà hằng ngày. Chỉ Giám đốc vận hành được duyệt tăng bậc sau 3 lần rà liên tiếp đều đạt, đủ dữ liệu đã quy định trước, không còn sự cố chưa xử lý và đã rà chi phí, mức sử dụng. Thiếu dữ liệu hoặc có lần không đạt thì khóa tăng bậc và tính lại chuỗi đạt. Sớm nhất khoảng 16 ngày từ khi bắt đầu bậc nếu lần rà đầu diễn ra ngay khi đủ dữ liệu. Ở bậc 50%, thu đủ mẫu phân tích rồi áp dụng cùng điều kiện rà an toàn trước khi ra quyết định."
  rollout_50_enrollment: "Kiểm tiến độ sau tuần làm việc đầu tiên, chỉ dựa trên số người, số yêu cầu và an toàn. Dự kiến khoảng 10 ngày làm việc nếu mỗi người nhận 30 yêu cầu đủ điều kiện mỗi ngày. Nếu thiếu, giữ mức 50% và thu tiếp cả hai nhánh đến đủ mẫu. Giới hạn đề xuất là 15 ngày làm việc kể từ khi mở bậc 50%, cần chốt trước khởi động. Nếu chạm giới hạn mà thiếu mẫu hoặc mất cụm, giữ No-go và trình lại Gate 2a. Không chuyển bậc hay gia hạn theo kết quả hiệu quả đã xem."
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859  # Cỡ mẫu hiệu dụng. Thu ít nhất 299 yêu cầu cho mỗi người.
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Hai nhánh tuyển yêu cầu cùng thời gian trong cùng các depot. Bắt đầu mẫu phân tích chính khi đủ 20 nhân viên ở mỗi nhánh."
    spillover_risk: "Nhân viên có thể chia sẻ gợi ý trong cùng depot. Cấp quyền theo tài khoản, lưu log staff_id và giữ phân nhóm ban đầu khi phân tích."
    predeclared: "Chốt seed ngẫu nhiên, chỉ số chính, ngưỡng, mốc quyết định và cách phân tích có tính đến cụm trước khi chạy."
  recruitment_evidence: "Trước khi mở pilot, Giám đốc vận hành xác nhận danh sách 40 staff_id duy nhất kèm depot, lịch tham gia đồng thời và sản lượng dự kiến ít nhất 299 yêu cầu đủ điều kiện mỗi người. Lưu danh sách phân nhánh theo seed với đúng 20 người mỗi bên. Trước phân tích, kiểm đếm mẫu thực tế theo từng người và tính lại cỡ mẫu hiệu dụng nếu thiếu hoặc lệch cỡ cụm."
  recruitment_fallback: "Nếu chỉ có 20 nhân viên đủ điều kiện, giữ No-go cho pilot đo hiệu quả theo cụm và tiếp tục xử lý thủ công trong khi tuyển thêm ở các depot đủ điều kiện. Chia 10+10 có trần 500 yêu cầu hiệu dụng mỗi nhánh với ICC 0,02, thấp hơn 859 và kéo dài thời gian không khắc phục được. Nếu không tuyển đủ, trình lại Gate 2a với thiết kế mới. Chỉ xem xét ngẫu nhiên theo yêu cầu nếu kiểm soát tràn tác động và tính lại cỡ mẫu theo thiết kế thực tế. Mốc 1.251 mỗi nhánh cho MDE 5 điểm giả định các yêu cầu độc lập."
  review_reduction_gate: "Đề xuất thử giảm xem lại từng bậc trên ca nội địa chuẩn, vẫn xem lại 100% nhóm rủi ro cao. Trước khi thử bước kế tiếp, phải có 0 ca hoàn trùng, 0 ca sai tiền trong mẫu đối soát ngẫu nhiên đã định trước, tỷ lệ mở lại không quá 6% và chênh dưới 2 điểm phần trăm so với đối chứng qua 3 lần rà đủ dữ liệu. Dùng phút đo thật để ước tính chi phí cả hệ thống mỗi yêu cầu, gồm phần nhân viên xử lý sau chuyển hoặc làm lại, tránh tính trùng công lao động. Chỉ duy trì bậc xem lại thấp hơn khi chi phí đo ở bậc đó dưới 12.000 đ/yêu cầu và vẫn đạt điều kiện an toàn. Nếu thiếu dữ liệu hoặc an toàn không đạt thì giữ hoặc quay về mức xem lại trước, đồng thời áp dụng các luật dừng."
  stop_rules:
    - "NẾU tỷ lệ mở lại trong 7 ngày kể từ lúc nhận yêu cầu của nhánh trợ lý vượt 6% hoặc cao hơn đối chứng từ 2 điểm phần trăm TRONG 3 lần rà hằng ngày liên tiếp trên các yêu cầu đủ 7 ngày theo dõi ở cả hai nhánh THÌ Giám đốc vận hành tắt trợ lý trong 30 phút kể từ lần rà thứ ba KHÔNG THÌ khóa tăng bậc cho đến khi đủ dữ liệu và có 3 lần rà liên tiếp đều đạt theo rollout_gate. Một lần vượt ngưỡng đã đủ để khóa tăng bậc."
    - "NẾU phát hiện từ một ca hoàn trùng trở lên TRONG bất kỳ lúc nào qua cảnh báo sổ cái hoặc đối soát hằng ngày THÌ Giám đốc vận hành tắt trợ lý, chuyển yêu cầu mới và đang chờ về luồng nhân viên, đồng thời giao kế toán đối soát giao dịch trong vòng 30 phút kể từ lúc phát hiện KHÔNG THÌ tiếp tục giám sát và chỉ tăng bậc khi đạt rollout_gate."
    - "NẾU chi phí biến đổi mỗi việc thành công vượt 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí giữ mức triển khai, rà chi phí và trình lại phạm vi KHÔNG THÌ giữ phạm vi đang duyệt đến hết bước hiện tại."
    - "NẾU tỷ lệ sửa hoặc bỏ gợi ý vượt 40% TRONG một tuần THÌ Trưởng nhóm CSKH tạm giữ bước triển khai và rà các lý do sửa hoặc bỏ KHÔNG THÌ chỉ chuyển bước sau khi điều kiện an toàn và chi phí đạt."
  interim_looks: "Rà các ngưỡng vận hành đã định trước. Phân tích hiệu quả chính một lần ở mốc quyết định."
  inconclusive_result: "Báo chênh lệch ước tính và khoảng tin cậy 95% có tính đến cụm. Nếu cận trên dưới 5 điểm phần trăm, dừng vì dữ liệu loại trừ mức cải thiện tối thiểu. Nếu khoảng còn bao gồm cả giá trị dưới 5 điểm và mức 5 điểm, giữ No-go cho mở rộng và trình thiết kế mới nếu cần. Chỉ trình xem xét mở rộng khi cận dưới đạt ít nhất 5 điểm và đạt cả ngưỡng an toàn lẫn chi phí. MDE 6 điểm dùng để tính lực phát hiện tác động so với 0, không bảo đảm đủ lực để chứng minh cận dưới đạt 5 điểm. Chỉ kéo dài thu mẫu theo quy tắc đã chốt trước khi xem hiệu quả."
  rollback: "Giám đốc vận hành tắt trợ lý qua cờ cấu hình trong 30 phút. Yêu cầu mới và yêu cầu đang chờ chuyển về luồng nhân viên."
  decision_date: "Chưa có ngày lịch vì chưa chốt ngày khởi động và ngày khóa mẫu. Trước khi chạy, Giám đốc vận hành ghi ngày dự kiến. Ra quyết định hiệu quả sớm nhất 8 ngày sau yêu cầu cuối của mẫu phân tích chính tại bậc 50%, khi đủ mẫu và đã hoàn tất rà an toàn bậc cuối. Nếu thiếu bằng chứng, giữ No-go và ghi lại lịch đánh giá."
  simulated_inputs:
    - "Dữ liệu chạy thử là giả lập. Hai tỷ lệ mở lại 4,25% và 3,97% lấy từ cột quan sát trong bộ dữ liệu."
    - "Trong pilot đề xuất, đo phút xem lại và làm lại thực tế. Bất kỳ phép đối chiếu nào dùng phut_xem_lai_simulated hoặc phut_lam_lai_simulated phải ghi nhãn simulated."
